[project]
name = "wa-multiproject-bot-mcp"
version = "0.1.0"
description = "Local MCP adapter (stdio) for a self-hosted wa-multiproject-bot WhatsApp bot."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "knightkill" }]
license = { text = "MIT" }
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27.0",
]

[project.scripts]
wa-multiproject-bot-mcp = "wa_multiproject_bot_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wa_multiproject_bot_mcp"]
